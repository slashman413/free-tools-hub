<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compound Interest Calculator (embed)</title>
<meta name="robots" content="noindex">
<!-- Google tag (gtag.js) — attributes embed usage as referral traffic -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MY95FHB8JG"></script>
<script>
  window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}
  gtag('js',new Date());gtag('config','G-MY95FHB8JG');
  gtag('event','embed_load',{widget:'compound-calculator'});
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0f;color:#e8e8f0;padding:14px;line-height:1.5}
  .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;margin-bottom:12px}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:12px;color:#b8b8d0;margin-bottom:5px}
  .field input{width:100%;background:#12121a;border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#e8e8f0;padding:10px;font-size:15px;font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:2px}
  .stat{background:#101018;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:11px}
  .stat .l{font-size:11px;color:#8888b0}.stat .v{font-size:18px;font-weight:800;color:#a5b4fc;margin-top:3px}
  .stat.hl .v{color:#34d399}
  .pb{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
  .pb a{color:#a5b4fc;text-decoration:none;font-weight:700}.pb a:hover{text-decoration:underline}
  .pb .cta{color:#34d399}
  .note{font-size:10.5px;color:#50506e;margin-top:8px}
</style>
</head>
<body>
  <div class="card">
    <div class="grid2">
      <div class="field"><label>Initial lump sum</label><input type="number" id="initial" value="10000" oninput="update()"></div>
      <div class="field"><label>Monthly contribution</label><input type="number" id="monthly" value="500" oninput="update()"></div>
      <div class="field"><label>Annual return (%)</label><input type="number" id="rate" value="8" step="0.1" oninput="update()"></div>
      <div class="field"><label>Years</label><input type="number" id="years" value="20" oninput="update()"></div>
    </div>
    <div class="stats">
      <div class="stat hl"><div class="l">Final total assets</div><div class="v" id="rFinal">—</div></div>
      <div class="stat"><div class="l">Total contributed</div><div class="v" id="rPrin">—</div></div>
      <div class="stat"><div class="l">Total gains</div><div class="v" id="rGain">—</div></div>
      <div class="stat"><div class="l">Total return</div><div class="v" id="rRet">—</div></div>
    </div>
    <div style="margin-top:12px"><canvas id="chart" height="180"></canvas></div>
    <div class="note">For education only · not investment advice · nominal (excl. inflation/tax).</div>
    <div class="pb">
      <span>📈 Powered by <a href="https://slashmantools.us/compound-calculator/?utm_source=embed&utm_medium=widget&utm_campaign=compound-calc" target="_blank" rel="noopener">Compound Interest Calculator</a></span>
      <a class="cta" href="https://slashman413.github.io/twse-backtests/?utm_source=embed&utm_medium=widget&utm_campaign=compound-calc" target="_blank" rel="noopener">📊 台股量化回測 →</a>
    </div>
  </div>
<script>
  const $=id=>document.getElementById(id);
  const num=(v,d=0)=>{const x=parseFloat(v);return isFinite(x)?x:d;};
  const fmt=n=>Math.round(n).toLocaleString('en');
  let chart=null;
  function update(){
    const initial=Math.max(0,num($("initial").value)), monthly=Math.max(0,num($("monthly").value));
    const annual=Math.max(0,num($("rate").value))/100, years=Math.min(60,Math.max(0,Math.floor(num($("years").value))));
    const mRate=Math.pow(1+annual,1/12)-1;
    let bal=initial, prin=initial; const labels=['0'], pData=[Math.round(prin)], gData=[0];
    for(let y=1;y<=years;y++){ for(let m=0;m<12;m++){ bal=bal*(1+mRate)+monthly; prin+=monthly; } labels.push(String(y)); pData.push(Math.round(prin)); gData.push(Math.round(bal-prin)); }
    const gain=bal-prin, ret=prin>0?(gain/prin*100):0;
    $("rFinal").textContent=fmt(bal); $("rPrin").textContent=fmt(prin); $("rGain").textContent=fmt(gain); $("rRet").textContent=ret.toFixed(1)+'%';
    const ctx=$("chart").getContext('2d');
    const upper=gData.map((g,i)=>g+pData[i]);
    if(chart){chart.data.labels=labels;chart.data.datasets[0].data=pData;chart.data.datasets[1].data=upper;chart.update();}
    else{chart=new Chart(ctx,{type:'line',data:{labels,datasets:[
      {label:'Contributed',data:pData,backgroundColor:'rgba(99,102,241,.5)',borderColor:'#6366f1',fill:true,tension:.25,pointRadius:0},
      {label:'Gains',data:upper,backgroundColor:'rgba(52,211,153,.45)',borderColor:'#34d399',fill:true,tension:.25,pointRadius:0}]},
      options:{responsive:true,plugins:{legend:{labels:{color:'#9a9ac0',font:{size:11}}}},scales:{x:{ticks:{color:'#666',maxTicksLimit:11},grid:{color:'rgba(255,255,255,.05)'}},y:{ticks:{color:'#666',callback:v=>v>=1000?(v/1000)+'k':v},grid:{color:'rgba(255,255,255,.05)'}}}}});}
  }
  window.update=update;
  update();
</script>
</body>
</html>
